name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          PKG_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_FILE" ]; then
            echo "CRITICAL ERROR: No se encontro el archivo package.json en ninguna subcarpeta del repositorio."
            echo "Asegurate de haber ejecutado 'git add -f package.json' y hacer push."
            exit 1
          fi

          TARGET_DIR=$(dirname "$PKG_FILE")
          echo "Proyecto encontrado en: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          npm install
          npm install vite --no-save
          npm run build
          
          mkdir -p $GITHUB_WORKSPACE/output_dist
          cp -r dist/* $GITHUB_WORKSPACE/output_dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4