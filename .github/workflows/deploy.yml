name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Dynamic Path
        run: |
          # Localizar la subcarpeta que contiene el package.json
          TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "Entrando a la carpeta: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Instalacion y compilacion
          npm install
          npm install vite --no-save
          npm run build
          
          # Copiar dist a la raiz de la maquina virtual para el artefacto
          mkdir -p $GITHUB_WORKSPACE/output_dist
          cp -r dist/* $GITHUB_WORKSPACE/output_dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4