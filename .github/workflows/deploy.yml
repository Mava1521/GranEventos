name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate App, Install and Build
        run: |
          # Buscar la carpeta exacta que contiene el package.json de tu app
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_PATH" ]; then
            echo "Error: No se encontro ningun package.json"
            exit 1
          fi

          TARGET_DIR=$(dirname "$PKG_PATH")
          echo "Proyecto encontrado en: $TARGET_DIR"
          
          cd "$TARGET_DIR"
          
          # Instalacion y compilacion
          npm install
          npm install vite --no-save
          npm run build
          
          # Copiar el resultado de la compilacion a un directorio raiz temporal
          mkdir -p $GITHUB_WORKSPACE/output_dist
          if [ -d "dist" ]; then
            cp -r dist/* $GITHUB_WORKSPACE/output_dist/
          elif [ -d "build" ]; then
            cp -r build/* $GITHUB_WORKSPACE/output_dist/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './output_dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4